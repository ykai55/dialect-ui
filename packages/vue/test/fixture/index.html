<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>@dialect-ui/vue fixture</title>
    <style>
      /* v0.2 验收页：让布局可读，并把 tooltip 延迟压到 0，断言不用等 500ms。
         行为层从元素的计算样式里读这些令牌，和主题 CSS 是同一套机制。 */
      #theme-root {
        padding: 16px;
      }

      .fixture-section {
        margin: 12px 0;
        padding: 12px;
        border-top: 1px solid rgba(0, 0, 0, 0.15);
      }

      .fixture-section .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .fixture-section .check,
      .fixture-section .radio,
      .fixture-section .switch {
        display: flex;
      }

      .fixture-context {
        user-select: none;
      }

      .fixture-section .window {
        width: 280px;
        margin: 8px 0;
      }

      .tooltip[data-tooltip-layer] {
        --tooltip-show-delay: 0ms;
        --tooltip-hide-delay: 0ms;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="result">RUNNING</pre>

    <script type="module" src="./main.ts"></script>
    <script>
      // 兜底：模块加载失败或断言中断时，tools/test-fixture.sh 也必须看到 FAIL，
      // 不能把一直停在 RUNNING 的页面当成通过。
      setTimeout(function () {
        var el = document.getElementById("result");
        if (el && el.textContent.trim() === "RUNNING") {
          el.textContent = "FAIL 验收脚本没有跑完（模块加载失败或断言中断）";
        }
      }, 4500);
    </script>
  </body>
</html>
