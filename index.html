<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dialect · 跨平台原生观感组件库</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/theme-win11.css" />
    <link rel="stylesheet" href="css/theme-win10.css" />
    <link rel="stylesheet" href="css/theme-winxp.css" />
    <link rel="stylesheet" href="css/theme-macos.css" />
    <link rel="stylesheet" href="css/theme-macos15.css" />
    <link rel="stylesheet" href="css/theme-gnome.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__brand">Dialect <span>跨平台原生观感组件库</span></div>

      <div class="bar__group" role="group" aria-label="平台主题">
        <button class="seg" type="button" data-pick-theme="win11">Windows 11</button>
        <button class="seg" type="button" data-pick-theme="win10">Windows 10</button>
        <button class="seg" type="button" data-pick-theme="winxp">Windows XP</button>
        <button class="seg" type="button" data-pick-theme="macos">macOS 26</button>
        <button class="seg" type="button" data-pick-theme="macos15">macOS 15</button>
        <button class="seg" type="button" data-pick-theme="gnome">GNOME</button>
      </div>

      <div class="bar__group" role="group" aria-label="明暗">
        <button class="seg" type="button" data-pick-mode="light">浅色</button>
        <button class="seg" type="button" data-pick-mode="dark">深色</button>
      </div>

      <label class="bar__toggle">
        <input type="checkbox" id="compare" />
        全部平台并排
      </label>

      <div class="bar__spacer"></div>
      <div class="bar__hint" id="hint"></div>
      <a class="bar__repo" href="https://github.com/ykai55/dialect-ui" target="_blank" rel="noreferrer">GitHub ↗</a>
    </header>

    <main class="stage" id="stage">
      <section class="board" data-board="win11">
        <div class="board__cap">
          <b>Windows 11</b> Fluent / WinUI 3
          <code>data-theme="win11"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>

      <section class="board" data-board="win10">
        <div class="board__cap">
          <b>Windows 10</b> Aero / Win32
          <code>data-theme="win10"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>

      <section class="board" data-board="winxp">
        <div class="board__cap">
          <b>Windows XP</b> 经典外观（2000 / XP classic）
          <code>data-theme="winxp"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>

      <section class="board" data-board="macos">
        <div class="board__cap">
          <b>macOS</b> Tahoe (26) 起
          <code>data-theme="macos"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>

      <section class="board" data-board="macos15">
        <div class="board__cap">
          <b>macOS</b> 15 Sequoia 及更早（26 之前）
          <code>data-theme="macos15"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>

      <section class="board" data-board="gnome">
        <div class="board__cap">
          <b>GNOME</b> Adwaita / GTK4
          <code>data-theme="gnome"</code>
        </div>
        <div class="board__body" data-slot></div>
      </section>
    </main>

    <template id="specimen">
      <div class="panel">
        <section class="group">
          <h3 class="group__title">Buttons</h3>
          <div class="row">
            <button type="button" class="btn">Cancel</button>
            <button type="button" class="btn btn--primary">Save changes</button>
            <button type="button" class="btn" disabled>Disabled</button>
            <button type="button" class="btn btn--primary" disabled>Disabled</button>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">Text field</h3>
          <label class="field">
            <span class="field__label">Email address</span>
            <span class="field__wrap">
              <input
                class="field__input"
                type="text"
                placeholder="name@example.com"
                autocomplete="off"
              />
            </span>
          </label>
          <label class="field">
            <span class="field__label">Disabled</span>
            <span class="field__wrap">
              <input class="field__input" type="text" value="Not editable" disabled />
            </span>
          </label>
        </section>

        <section class="group">
          <h3 class="group__title">Selection</h3>

          <div class="stack">
            <label class="check">
              <input type="checkbox" class="check__input" checked />
              <span class="check__box"><svg class="check__mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 10.3 L8 14 L13.5 5.7" /></svg></span>
              <span class="check__label">Send me a copy</span>
            </label>
            <label class="check">
              <input type="checkbox" class="check__input" />
              <span class="check__box"><svg class="check__mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 10.3 L8 14 L13.5 5.7" /></svg></span>
              <span class="check__label">Remember this device</span>
            </label>
            <label class="check">
              <input type="checkbox" class="check__input" checked disabled />
              <span class="check__box"><svg class="check__mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 10.3 L8 14 L13.5 5.7" /></svg></span>
              <span class="check__label">Disabled</span>
            </label>
          </div>

          <div class="row row--tight">
            <label class="radio">
              <input type="radio" class="radio__input" name="appearance" checked />
              <span class="radio__dot"></span>
              <span class="radio__label">Light</span>
            </label>
            <label class="radio">
              <input type="radio" class="radio__input" name="appearance" />
              <span class="radio__dot"></span>
              <span class="radio__label">Dark</span>
            </label>
            <label class="radio">
              <input type="radio" class="radio__input" name="appearance" disabled />
              <span class="radio__dot"></span>
              <span class="radio__label">Auto</span>
            </label>
          </div>

          <div class="stack">
            <label class="switch">
              <input type="checkbox" class="switch__input" checked />
              <span class="switch__track"><span class="switch__knob"></span></span>
              <span class="switch__label">Wi-Fi</span>
            </label>
            <label class="switch">
              <input type="checkbox" class="switch__input" />
              <span class="switch__track"><span class="switch__knob"></span></span>
              <span class="switch__label">Bluetooth</span>
            </label>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">Segmented</h3>
          <div class="segmented" data-segmented role="radiogroup" aria-label="Interval">
            <button type="button" class="segmented__item" role="radio" aria-checked="true" data-value="day">Day</button>
            <button type="button" class="segmented__item" role="radio" aria-checked="false" data-value="week">Week</button>
            <button type="button" class="segmented__item" role="radio" aria-checked="false" data-value="month">Month</button>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">Tabs</h3>
          <div class="tabs" data-tabs>
            <div class="tabs__list" role="tablist" aria-label="Sections">
              <button type="button" class="tabs__tab" role="tab" aria-selected="true">General</button>
              <button type="button" class="tabs__tab" role="tab" aria-selected="false">Advanced</button>
              <button type="button" class="tabs__tab" role="tab" aria-selected="false">About</button>
            </div>
            <div class="tabs__panel">
              <p>General settings live here.</p>
            </div>
            <div class="tabs__panel" hidden>
              <p>Advanced settings live here.</p>
            </div>
            <div class="tabs__panel" hidden>
              <p>Version 1.0 · Dialect</p>
            </div>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">Progress</h3>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow="40" style="--progress-value: 40%">
            <div class="progress__fill"></div>
          </div>
          <div class="progress" role="progressbar" aria-valuetext="Loading" data-indeterminate>
            <div class="progress__fill"></div>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">Tooltip</h3>
          <div class="row">
            <button type="button" class="btn" data-tooltip="Saves your changes">Save changes</button>
            <button type="button" class="btn" data-tooltip="Discard and close">Cancel</button>
          </div>
          <div class="tooltip" role="tooltip" data-tooltip-layer hidden></div>
        </section>

        <section class="group">
          <h3 class="group__title">Menu</h3>

          <div class="menu-demo" data-menu>
            <button type="button" class="btn" data-menu-trigger>Actions</button>
            <ul class="menu" popover="manual" role="menu">
              <li class="menu__item" role="menuitem">New window</li>
              <li class="menu__item" role="menuitem" aria-disabled="true">Duplicate</li>
              <li class="menu__separator" role="separator"></li>
              <li class="menu__item" role="menuitem">Rename<span class="menu__shortcut">F2</span></li>
              <li class="menu__item" role="menuitem">Delete</li>
            </ul>
          </div>

          <div class="menu-demo" data-menu>
            <div class="menu-target" data-menu-context tabindex="0">Right-click here, or press Shift+F10</div>
            <ul class="menu" popover="manual" role="menu">
              <li class="menu__item" role="menuitem">Copy</li>
              <li class="menu__item" role="menuitem">Paste</li>
              <li class="menu__separator" role="separator"></li>
              <li class="menu__item" role="menuitem" aria-disabled="true">Duplicate</li>
              <li class="menu__item" role="menuitem">Delete<span class="menu__shortcut">Del</span></li>
            </ul>
          </div>
        </section>

        <section class="group">
          <h3 class="group__title">More</h3>
          <label class="field">
            <span class="field__label">Notes</span>
            <span class="field__wrap">
              <textarea class="field__input field__input--multiline" rows="2" placeholder="Write something…"></textarea>
            </span>
          </label>

          <div class="row">
            <div class="select" data-select>
              <button type="button" class="select__button">
                <span class="select__value">Option A</span>
                <span class="select__chevron">
                  <span class="select__chevron-up"></span>
                  <span class="select__chevron-down"></span>
                </span>
              </button>
              <ul class="menu" popover="manual">
                <li class="menu__item" aria-selected="true">Option A</li>
                <li class="menu__item" aria-selected="false">Option B</li>
                <li class="menu__item" aria-selected="false">Option C — longer label</li>
                <li class="menu__item" aria-selected="false">Option D</li>
              </ul>
            </div>
          </div>

          <div class="slider-row">
            <input class="slider" type="range" min="0" max="100" value="40" aria-label="Volume" />
            <span class="slider__value">40</span>
          </div>
        </section>

        <!-- 文本框右键菜单：右键输入框或多行输入时在指针处展开。
             同一份 markup 每个面板各一份，主题跟着面板走。 -->
        <ul class="menu" popover="manual" data-text-menu role="menu">
          <li class="menu__item" role="menuitem" data-action="cut">Cut</li>
          <li class="menu__item" role="menuitem" data-action="copy">Copy</li>
          <li class="menu__item" role="menuitem" data-action="paste">Paste</li>
          <li class="menu__separator" role="separator"></li>
          <li class="menu__item" role="menuitem" data-action="delete">Delete</li>
          <li class="menu__separator" role="separator"></li>
          <li class="menu__item" role="menuitem" data-action="selectall">Select All</li>
        </ul>
      </div>
    </template>

    <script src="js/app.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/select.js"></script>
    <script src="js/text-menu.js"></script>
    <script src="js/segmented.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/slider.js"></script>
  </body>
</html>
