<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Window 组件测试</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/window.css" />
    <link rel="stylesheet" href="../css/theme-win10.css" />
  </head>
  <body data-theme="win10" data-mode="light">
    <div class="window" data-window id="win">
      <div class="window__bar">
        <div class="window__title">Test window</div>
        <div class="window__controls">
          <button type="button" class="window__caption" data-window-action="close">✕</button>
        </div>
      </div>
      <div class="window__body">
        <input class="field__input" type="text" value="hello" />
        <button type="button" class="btn" id="disabled" disabled>Disabled</button>
      </div>
    </div>

    <div class="window" data-window data-window-frame="macos" id="macwin" style="width: 320px; margin-top: 16px">
      <div class="window__bar">
        <div class="window__traffic">
          <button type="button" class="window__traffic-dot window__traffic-dot--close" data-window-action="close" aria-label="关闭"><span class="window__traffic-glyph"><svg viewBox="-2 -2 16 16" aria-hidden="true"><path d="M3.1 3.1l5.8 5.8M8.9 3.1L3.1 8.9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span></button>
          <button type="button" class="window__traffic-dot window__traffic-dot--min" data-window-action="minimize" aria-label="最小化"><span class="window__traffic-glyph"><svg viewBox="-2 -2 16 16" aria-hidden="true"><path d="M2.55 6h6.9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span></button>
          <button type="button" class="window__traffic-dot window__traffic-dot--zoom" data-window-action="maximize" aria-label="缩放"><span class="window__traffic-glyph"><svg viewBox="-2 -2 16 16" aria-hidden="true"><path d="M2.05 2.05v6.6L8.65 2.05zM9.95 9.95V3.35L3.35 9.95z" fill="currentColor"/></svg></span></button>
        </div>
        <div class="window__title">mac window</div>
      </div>
      <div class="window__body"></div>
    </div>
    <button type="button" class="btn" id="outside">outside</button>
    <pre id="result">RUNNING</pre>

    <script src="../js/menu.js"></script>
    <script src="../js/text-menu.js"></script>
    <script src="../js/window.js"></script>
    <script>
      (async function () {
        var lines = [];
        function check(name, ok) {
          lines.push((ok ? "PASS " : "FAIL ") + name);
          document.getElementById("result").textContent = lines.join("\n");
        }
        function fire(el) {
          var e = new MouseEvent("contextmenu", {
            bubbles: true,
            cancelable: true,
            clientX: 30,
            clientY: 30
          });
          el.dispatchEvent(e);
          return e;
        }
        function wait() {
          return new Promise(function (r) { setTimeout(r, 30); });
        }

        var win = document.getElementById("win");
        var body = win.querySelector(".window__body");
        var field = win.querySelector(".field__input");
        var disabled = document.getElementById("disabled");

        check("自动初始化", win.hasAttribute("data-window-ready"));
        check("窗口内默认不弹浏览器菜单", fire(body).defaultPrevented === true);

        var actionFired = null;
        win.addEventListener("window:action", function (e) { actionFired = e.detail.action; });
        win.querySelector("[data-window-action]").click();
        check("窗口按钮派发 window:action", actionFired === "close");

        check("右键文本前还没有菜单", !win.querySelector("[data-text-menu]"));
        var ctxEvent = fire(field);
        await wait();
        var menu = win.querySelector("[data-text-menu]");
        check("文本框右键懒创建菜单", !!menu);
        check("文本框右键拦住浏览器菜单", ctxEvent.defaultPrevented === true);
        check("菜单已展开", !!menu && menu.matches(":popover-open"));
        check("菜单项齐全", !!menu && menu.querySelectorAll(".menu__item").length === 5);
        check("菜单挂在窗口内容区", !!menu && menu.parentElement === body);

        if (menu) menu.hidePopover();
        check("关闭后菜单收起", !!menu && !menu.matches(":popover-open"));

        var disabledEvent = fire(disabled);
        check("禁用按钮右键也被拦截", disabledEvent.defaultPrevented === true);
        check("禁用按钮不会弹出文本菜单", !!menu && !menu.matches(":popover-open"));

        check("窗口外不拦截浏览器菜单", fire(document.getElementById("outside")).defaultPrevented === false);


        /* 红绿灯几何：符号中心必须和圆点中心一致，绿色缩放三角方向朝外 */
        var macwin = document.getElementById("macwin");
        var dots = Array.prototype.slice.call(macwin.querySelectorAll(".window__traffic-dot"));
        dots.forEach(function (dot, i) {
          var d = dot.getBoundingClientRect();
          var svg = dot.querySelector("svg").getBoundingClientRect();
          var path = dot.querySelector("path").getBoundingClientRect();
          var dx = Math.abs((d.left + d.width / 2) - (svg.left + svg.width / 2));
          var dy = Math.abs((d.top + d.height / 2) - (svg.top + svg.height / 2));
          var px = Math.abs((d.left + d.width / 2) - (path.left + path.width / 2));
          var py = Math.abs((d.top + d.height / 2) - (path.top + path.height / 2));
          check("红绿灯 " + i + " 符号中心和圆点对齐", dx <= 0.05 && dy <= 0.05 && px <= 0.05 && py <= 0.05);
        });
        (function () {
          var green = dots[2].querySelector("path");
          var svg = green.ownerSVGElement;
          function inside(x, y) {
            var pt = svg.createSVGPoint();
            pt.x = x; pt.y = y;
            return green.isPointInFill(pt);
          }
          var bb = green.getBBox();
          check(
            "缩放三角在 viewBox 里居中",
            Math.abs(bb.x + bb.width / 2 - 6) < 0.01 &&
              Math.abs(bb.y + bb.height / 2 - 6) < 0.01
          );
          check("缩放三角在左上 / 右下", inside(3, 3) && inside(9, 9));
          check("缩放在右上 / 左下留空", !inside(9, 3) && !inside(3, 9));
        })();
        var failed = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
        lines.push(failed ? "FAILED " + failed : "ALL PASS (" + lines.length + ")");
        document.getElementById("result").textContent = lines.join("\n");
      })();
    </script>
  </body>
</html>
